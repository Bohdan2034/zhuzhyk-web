services:
  app:
    build: ./backend
    environment:
      PORT: 3000
      SERVICE_NAME: demo-app
      SERVICE_VERSION: 1.0.0
      DEPLOYMENT_ENVIRONMENT: workshop
      LOG_LEVEL: info
      LOG_FILE_PATH: /var/log/demo/app.log
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    volumes:
      - ./data/logs:/var/log/demo
    ports:
      - "${APP_PORT:-3002}:3000"
    depends_on:
      - collector

  loadgen:
    build: ./loadgen
    environment:
      API_BASE_URL: http://app:3000
      LOAD_INTERVAL_MS: 1200
      ORDERS_INTERVAL_MS: 2600
    depends_on:
      - app

  collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./data/logs:/var/log/demo
    ports:
      - "${COLLECTOR_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app

  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${TEMPO_OTLP_PORT:-4319}:4317"

  loki:
    image: grafana/loki:2.9.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "${LOKI_PORT:-3100}:3100"

  grafana:
    image: grafana/grafana:10.4.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

networks:
  default:
    name: observability-demo
