
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жужик — товари</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
        }

        input {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .section {
            margin-top: 25px;
        }

        #warning {
            display: none;
            padding: 15px;
            margin-top: 15px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
        }

        #status, #createStatus {
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <h1>🐝 Жужик — список товарів</h1>

    <button id="loadItems">Завантажити товари</button>

    <p id="status"></p>
    <div id="warning"></div>
    <ul id="itemsList"></ul>

    <div class="section">
        <h2>Створити товар</h2>

        <form id="productForm">
            <input
                id="productName"
                placeholder="Назва товару"
                required
            >

            <input
                id="productPrice"
                type="number"
                min="0"
                step="0.01"
                placeholder="Ціна"
                required
            >

            <input
                id="productStock"
                type="number"
                min="0"
                step="1"
                placeholder="Кількість"
                required
            >

            <button id="createButton" type="submit">
                Створити товар
            </button>
        </form>

        <p id="createStatus"></p>
    </div>

    <script>
        const loadButton = document.getElementById('loadItems');
        const list = document.getElementById('itemsList');
        const status = document.getElementById('status');
        const warning = document.getElementById('warning');

        const form = document.getElementById('productForm');
        const createButton = document.getElementById('createButton');
        const createStatus = document.getElementById('createStatus');

        const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

        let failures = 0;

        function getBackoff(attempt) {
            const base = 250 * (2 ** attempt);
            const jitter = Math.floor(Math.random() * 100);
            return base + jitter;
        }

        async function fetchWithResilience(url, options = {}) {
            const retries = 2;
            const timeoutMs = 1000;

            const method = (options.method || 'GET').toUpperCase();

            // Один ключ на всі повтори одного POST-запиту
            const idempotencyKey =
                method === 'POST'
                    ? crypto.randomUUID()
                    : null;

            for (let attempt = 0; attempt <= retries; attempt++) {
                const controller = new AbortController();

                const headers = new Headers(options.headers || {});
                headers.set('X-Request-Id', crypto.randomUUID());

                if (idempotencyKey) {
                    headers.set('Idempotency-Key', idempotencyKey);
                }

                let response;
                let networkError = null;

                const timer = setTimeout(
                    () => controller.abort(),
                    timeoutMs
                );

                try {
                    response = await fetch(url, {
                        ...options,
                        method,
                        headers,
                        signal: controller.signal
                    });
                } catch (error) {
                    networkError = error;
                } finally {
                    clearTimeout(timer);
                }

                if (networkError) {
                    if (attempt === retries) {
                        throw networkError;
                    }

                    await sleep(getBackoff(attempt));
                    continue;
                }

                if (response.ok) {
                    return response;
                }

                const retryable =
                    response.status === 429 ||
                    response.status >= 500;

                if (!retryable || attempt === retries) {
                    throw new Error(`HTTP ${response.status}`);
                }

                let delay = getBackoff(attempt);

                if (response.status === 429) {
                    const retryAfterHeader =
                        response.headers.get('Retry-After');

                    if (retryAfterHeader !== null) {
                        const seconds = Number(retryAfterHeader);

                        if (Number.isFinite(seconds) && seconds >= 0) {
                            delay = seconds * 1000;
                        } else {
                            const retryDate =
                                Date.parse(retryAfterHeader);

                            if (!Number.isNaN(retryDate)) {
                                delay = Math.max(
                                    0,
                                    retryDate - Date.now()
                                );
                            }
                        }
                    }
                }

                await sleep(delay);
            }
        }

        function renderItems(items) {
            list.replaceChildren();

            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.id}: ${item.name}`;
                list.appendChild(li);
            });
        }

        async function loadItems() {
            loadButton.disabled = true;
            status.textContent = 'Завантаження товарів...';

            try {
                const response = await fetchWithResilience('/items');
                const items = await response.json();

                renderItems(items);

                failures = 0;
                warning.style.display = 'none';
                status.textContent = 'Товари завантажено успішно!';
            } catch (error) {
                failures++;

                status.textContent =
                    `Помилка завантаження: ${error.message}`;

                if (failures >= 2) {
                    warning.style.display = 'block';
                    warning.textContent =
                        '⚠️ Сервер тимчасово недоступний. ' +
                        'Показано останні завантажені товари.';
                }
            } finally {
                loadButton.disabled = false;
            }
        }

        async function createProduct(event) {
            event.preventDefault();

            const product = {
                name: document.getElementById('productName').value.trim(),
                price: Number(
                    document.getElementById('productPrice').value
                ),
                stock: Number(
                    document.getElementById('productStock').value
                )
            };

            createButton.disabled = true;
            createStatus.textContent = 'Створення товару...';

            try {
                const response = await fetchWithResilience('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(product)
                });

                const created = await response.json();

                createStatus.textContent =
                    `Товар створено! ID: ${created.id}`;

                form.reset();

                await loadItems();
            } catch (error) {
                createStatus.textContent =
                    `Помилка створення: ${error.message}`;
            } finally {
                createButton.disabled = false;
            }
        }

        loadButton.addEventListener('click', loadItems);
        form.addEventListener('submit', createProduct);
    </script>
</body>
</html>
